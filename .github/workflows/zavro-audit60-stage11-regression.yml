name: Zavro Clean audit60 stage 11 - tab order and undo regression (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-audit60-stage11-tabs-undo-groups-20261031
      - fix/zavro-clean-audit60-stage11b-undo-slot-finalization-20261031
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit60-stage11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Full Kotlin JVM and Robolectric regressions
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Compile instrumented tests without assembling APK
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain
      - name: Full WebExtension JS regressions
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit60-stage11-test-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
