name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach APKs to (e.g. v1.2.3)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_PACKAGE: com.prirai.android.nira.mpv
      EXPECTED_VERSION_CODE: "1166"
      EXPECTED_VERSION_NAME: 0.5.22-alpha72-mpv40
      EXPECTED_CERT_SHA256: df90b01217fbbf973b65865be64bfede267e17fec611c355b814585dfba83f00

    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      # Do not publish an ephemeral Android debug signature as an update.
      # Reuse the stable signing key already used by the release workflow.
      - name: Build signed standalone arm64 Zavro x MPV APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Stable signing secret $key is not configured. Refusing to publish an incompatible debug APK."
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/nira-update.p12"
          cleanup() {
            rm -f "$keystore_path"
          }
          trap cleanup EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          export NIRA_SIGNING_STORE_FILE="$keystore_path"
          export NIRA_SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          export NIRA_SIGNING_KEY_ALIAS="$KEY_ALIAS"
          export NIRA_SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
          ./gradlew assembleDebug -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --max-workers=2 --console=plain
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [[ "${apks[0]}" != *arm64-v8a* ]]; then
            echo "::error::Expected exactly one arm64-v8a APK, got ${#apks[@]}."
            exit 1
          fi
          bash scripts/verify-update-apk.sh \
            "${apks[0]}" \
            "$EXPECTED_PACKAGE" \
            "$EXPECTED_VERSION_CODE" \
            "$EXPECTED_VERSION_NAME" \
            "$EXPECTED_CERT_SHA256"
          echo "Built standalone Zavro x MPV arm64-v8a APK. Normal Zavro package is untouched. Device installation not verified."

      - name: Upload standalone Zavro x MPV arm64 debug build
        uses: actions/upload-artifact@v4
        with:
          name: zavro-x-mpv-arm64-v1166-independent
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30


  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Run Android lint
        run: ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --max-workers=2

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug*
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --max-workers=2

      - name: Test media detector WebExtension protocol
        run: node --test app/src/test/js/*.test.cjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/video-discovery/package-lock.json

      - name: Controlled Chromium video discovery fixtures (not Gecko or Android)
        run: |
          npm ci --ignore-scripts --prefix scripts/video-discovery
          scripts/video-discovery/node_modules/.bin/playwright install --with-deps chromium
          DISCOVERY_REPORT=app/build/reports/video-discovery.json node scripts/video-discovery/fixtures.cjs
          sha256sum -c scripts/video-discovery/v1164/frozen-cases.sha256
          DISCOVERY_SET=B DISCOVERY_REPORT=app/build/reports/discovery-B-network.json node scripts/video-discovery/v1164/network-fixtures.cjs
          DISCOVERY_SET=C DISCOVERY_REPORT=app/build/reports/discovery-C-network.json node scripts/video-discovery/v1164/network-fixtures.cjs
          DISCOVERY_SET=DOM_B DISCOVERY_REPORT=app/build/reports/discovery-B-DOM.json node scripts/video-discovery/v1164/dom-fixtures.cjs
          DISCOVERY_SET=DOM_C DISCOVERY_REPORT=app/build/reports/discovery-C-DOM.json node scripts/video-discovery/v1164/dom-fixtures.cjs

      - name: Protected Lua and DSP regressions
        timeout-minutes: 10
        run: |
          if ! python3 -c 'import ctypes.util; assert ctypes.util.find_library("lua5.4")' || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y liblua5.4-0 ffmpeg
          fi
          python3 scripts/test-alpha-lua-bridge.py
          python3 scripts/test-custom-lua-host.py
          python3 scripts/test-lua-environment.py
          python3 scripts/test-drc-de-lua.py
          python3 scripts/test-alpha-audio-dsp.py
          python3 scripts/test-drc-de-dsp.py

      - name: Upload video discovery metrics
        uses: actions/upload-artifact@v4
        with:
          name: video-discovery-v1164
          path: |
            app/build/reports/video-discovery.json
            app/build/reports/discovery-*.json
          if-no-files-found: error

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_PACKAGE: com.prirai.android.nira.mpv
      EXPECTED_VERSION_CODE: "1166"
      EXPECTED_VERSION_NAME: 0.5.22-alpha72-mpv40
      EXPECTED_CERT_SHA256: df90b01217fbbf973b65865be64bfede267e17fec611c355b814585dfba83f00

    # Release only on a version tag or manual dispatch with an explicit tag.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          submodules: true
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Build and verify one signed arm64 release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Stable signing secret $key is not configured."
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/nira-release.p12"
          cleanup() {
            rm -f "$keystore_path"
          }
          trap cleanup EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$keystore_path" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --console=plain
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [[ "${apks[0]}" != *arm64-v8a* ]]; then
            echo "::error::Expected exactly one arm64-v8a release APK, got ${#apks[@]}."
            exit 1
          fi
          bash scripts/verify-update-apk.sh \
            "${apks[0]}" \
            "$EXPECTED_PACKAGE" \
            "$EXPECTED_VERSION_CODE" \
            "$EXPECTED_VERSION_NAME" \
            "$EXPECTED_CERT_SHA256"

      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.tag.outputs.tag }}" \
          || gh release create "${{ steps.tag.outputs.tag }}" \
               --title "Release ${{ steps.tag.outputs.tag }}" \
               --notes "Automated release build"

      - name: Upload Release APKs (standalone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            app/build/outputs/apk/release/*.apk \
            --clobber
