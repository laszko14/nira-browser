name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - "**"

  # Explicit owner review command supported by the GitHub connector.
  # Ordinary submitted reviews only run tests; build remains fail-closed.
  pull_request_review:
    types: [submitted]

  workflow_dispatch:
    inputs:
      build_kind:
        description: "Default tests-only. Private signed update for authorized implementation; public publication separate."
        required: true
        default: tests-only
        type: choice
        options:
          - tests-only
          - publish-release
      approval_phrase:
        description: "Only for explicit public publication: Publikuj"
        required: false
        type: string
      task_kind:
        description: "Authorized task category; signed private APK only for implementation"
        required: true
        default: none
        type: choice
        options:
          - none
          - implementation
      task_id:
        description: "Implementation task identifier"
        required: false
        type: string
      source_sha:
        description: "Exact 40-character source commit SHA"
        required: false
        type: string
      tag:
        description: "Existing release tag (required only for publish-release)"
        required: false
        type: string

jobs:
  build:
    # Push/PR/tag never sign. Dispatch is task/SHA guarded; the alternative
    # is the exact owner review command validated before signing secrets.
    needs: regression-tests
    if: >-
      always() &&
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.state == 'commented' &&
      github.actor == 'laszko14' &&
      github.event.review.user.login == 'laszko14' &&
      github.event.pull_request.head.repo.full_name == 'laszko14/nira-browser' &&
      startsWith(github.event.review.body, 'ZAVRO_PRIVATE_APK_REQUEST')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_PACKAGE: com.prirai.android.nira.debug
      EXPECTED_VERSION_CODE: "1224"
      EXPECTED_VERSION_NAME: 0.5.22-alpha120-clean
      EXPECTED_CERT_SHA256: df90b01217fbbf973b65865be64bfede267e17fec611c355b814585dfba83f00

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact owner review and current SOURCE CI (no secrets)
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_BODY: ${{ github.event.review.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/authorize-private-apk-review.cjs
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
          live_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg sha "$REVIEW_HEAD_SHA" --arg ref "$PR_HEAD_REF" '
            .state == "open" and .merged_at == null and
            .head.sha == $sha and .head.ref == $ref and
            .head.repo.full_name == "laszko14/nira-browser" and
            .base.repo.full_name == "laszko14/nira-browser"
          ' <<< "$live_pr" >/dev/null
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/zavro-ai-process-docs.yml/runs?event=push&head_sha=$REVIEW_HEAD_SHA&branch=$PR_HEAD_REF&per_page=100")"
          run_id="$(jq -er --arg sha "$REVIEW_HEAD_SHA" --arg ref "$PR_HEAD_REF" '
            [.workflow_runs[] | select(.event == "push" and
              .head_sha == $sha and .head_branch == $ref)][0].id
          ' <<< "$runs")"
          node scripts/ci-run-receipt.cjs "$run_id" "$REVIEW_HEAD_SHA" "$PR_HEAD_REF"
          echo "Validated six SOURCE gates for exact reviewed SHA; PR merge tests are separate."
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      # Do not publish an ephemeral Android debug signature as an update.
      # Reuse the stable signing key already used by the release workflow.
      - name: Recheck live PR HEAD immediately before signing secrets
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
          actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          test "$actual_sha" = "$REVIEW_HEAD_SHA" || { echo "::error::PR head changed after authorization"; exit 1; }

      - name: Build single arm64 debug APK (update-safe certificate)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Stable signing secret $key is not configured. Refusing to publish an incompatible debug APK."
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/nira-update.p12"
          cleanup() {
            rm -f "$keystore_path"
          }
          trap cleanup EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          export NIRA_SIGNING_STORE_FILE="$keystore_path"
          export NIRA_SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          export NIRA_SIGNING_KEY_ALIAS="$KEY_ALIAS"
          export NIRA_SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
          ./gradlew assembleDebug --console=plain
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [[ "${apks[0]}" != *arm64-v8a* ]]; then
            echo "::error::Expected exactly one arm64-v8a APK, got ${#apks[@]}."
            exit 1
          fi
          bash scripts/verify-update-apk.sh \
            "${apks[0]}" \
            "$EXPECTED_PACKAGE" \
            "$EXPECTED_VERSION_CODE" \
            "$EXPECTED_VERSION_NAME" \
            "$EXPECTED_CERT_SHA256"
          echo "Built and verified exactly one update-safe arm64-v8a APK."

      - name: Upload only arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zavro-arm64-update-apk-v1223
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30


  regression-tests:
    if: github.event_name != 'pull_request_review'
    name: Shared regression gates (NO APK)
    uses: ./.github/workflows/zavro-tests-reusable.yml
    permissions:
      contents: read


  error-learning-evidence:
    if: always() && github.event_name != 'pull_request_review'
    needs: regression-tests
    name: Error learning evidence (NO APK)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Capture completed PR / dispatch regression failures
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/capture-ci-errors.cjs "$GITHUB_RUN_ID" "$SOURCE_HEAD_SHA" "$RUNNER_TEMP/v31-ci-errors.json"
      - name: Upload V3.1 CI failure metadata (NO APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-ci-errors-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v31-ci-errors.json
          retention-days: 30
          if-no-files-found: error

  release:
    needs: regression-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_PACKAGE: com.prirai.android.nira
      # The version code/name are resolved from app/build.gradle at the checked-out TAG.
      # Do not hardcode tag-dependent metadata in the event workflow.
      EXPECTED_CERT_SHA256: df90b01217fbbf973b65865be64bfede267e17fec611c355b814585dfba83f00

    # Publishing is a separate, explicit authorization; tag push never
    # publishes or builds. Keep tag-based checkout and signed verifier.
    if: github.event_name == 'workflow_dispatch' && inputs.build_kind == 'publish-release' && inputs.approval_phrase == 'Publikuj' && inputs.tag != ''

    steps:
      - name: Resolve and validate an actual version tag (never a branch)
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "::error::Release requires a version tag vX.Y.Z[-suffix], not a branch or SHA."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          submodules: true
      - name: Verify tagged source is the tested dispatch SHA
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag SHA differs from dispatch SHA verified by shared tests."
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Resolve expected release version from the checked-out tag (no APK)
        run: node scripts/resolve-release-contract.cjs

      - name: Build and verify one signed arm64 release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Stable signing secret $key is not configured."
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/nira-release.p12"
          cleanup() {
            rm -f "$keystore_path"
          }
          trap cleanup EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$keystore_path" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --console=plain
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [[ "${apks[0]}" != *arm64-v8a* ]]; then
            echo "::error::Expected exactly one arm64-v8a release APK, got ${#apks[@]}."
            exit 1
          fi
          bash scripts/verify-update-apk.sh \
            "${apks[0]}" \
            "$EXPECTED_PACKAGE" \
            "$EXPECTED_VERSION_CODE" \
            "$EXPECTED_VERSION_NAME" \
            "$EXPECTED_CERT_SHA256"

      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.tag.outputs.tag }}" \
          || gh release create "${{ steps.tag.outputs.tag }}" \
               --title "Release ${{ steps.tag.outputs.tag }}" \
               --notes "Automated release build"

      - name: Upload Release APKs (standalone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            app/build/outputs/apk/release/*.apk \
            --clobber
