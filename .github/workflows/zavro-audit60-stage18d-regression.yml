name: Zavro Clean audit60 stage 18D - resume representation integrity (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-audit60-stage18d-resume-integrity-20261031
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit60-stage18d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Resume identity and response regression (fast gate)
        run: |
          node --test app/src/test/js/download-resume-stage18d.test.cjs
          ./gradlew :app:testDebugUnitTest --tests "com.prirai.android.nira.audit.DownloadResumeGuardTest" --console=plain
      - name: Full Kotlin JVM and Robolectric regressions
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Compile instrumented tests without assembling APK
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain
      - name: Full WebExtension JS regressions
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit60-stage18d-test-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
