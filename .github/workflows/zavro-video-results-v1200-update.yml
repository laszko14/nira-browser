name: Zavro Clean video results v1200 signed update
on:
  push:
    branches:
      - fix/zavro-clean-video-results-state-v1200-20261101
    paths:
      - .github/workflows/zavro-video-results-v1200-update.yml
permissions:
  contents: read
concurrency:
  group: zavro-video-results-v1200-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authorized-source:
    if: contains(github.event.head_commit.message, '[authorized-video-results-v1200]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source, scope and version contract
        shell: bash
        run: |
          set -euo pipefail
          source_sha=c6df406cb630660d26ef9d2a105d22768b1f7ad3
          test "$GITHUB_REF_NAME" = 'fix/zavro-clean-video-results-state-v1200-20261101'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          git diff --name-only "$source_sha" "$GITHUB_SHA" > "$RUNNER_TEMP/changed"
          test -s "$RUNNER_TEMP/changed"
          while IFS= read -r changed; do
            case "$changed" in
              app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchResultsActivity.kt|app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchResultsTabContent.kt|app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchResultsTabUiMemory.kt|app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchResultsTabUiMemoryTest.kt|app/build.gradle|.github/workflows/apk-release.yml|app/src/test/js/release-contract-stage19a.test.cjs|app/src/test/js/update-apk-workflow-scope.test.cjs|.github/workflows/zavro-video-results-v1200-update.yml|docs/AI_HANDOFF.md) ;;
              *) echo "::error::Unapproved change: $changed"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changed"
          git diff --quiet "$source_sha" "$GITHUB_SHA" -- AGENTS.md
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const gradle=fs.readFileSync('app/build.gradle','utf8');
          const release=fs.readFileSync('.github/workflows/apk-release.yml','utf8');
          const {assertUpdateApkContract}=require('./app/src/test/js/helpers/update-apk-contract.cjs');
          assert.deepEqual(assertUpdateApkContract(gradle,release),{
            installCode:1200,versionName:'0.5.22-alpha105-clean'
          });
          const checkpoint=fs.readFileSync('docs/AI_HANDOFF.md','utf8');
          assert.match(checkpoint,/^branch: fix\/zavro-clean-video-results-state-v1200-20261101$/m);
          console.log('Video results v1200 version and checkpoint PASS.');
          NODE
          node --test scripts/check-ci-workflows.test.cjs
          git diff --check "$source_sha" "$GITHUB_SHA"
  regressions:
    name: Required shared code gates (NO APK)
    uses: ./.github/workflows/zavro-tests-reusable.yml
    permissions:
      contents: read
  signed-update:
    if: contains(github.event.head_commit.message, '[authorized-video-results-v1200]')
    needs: [authorized-source, regressions]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_PACKAGE: com.prirai.android.nira.debug
      EXPECTED_VERSION_CODE: '1200'
      EXPECTED_VERSION_NAME: 0.5.22-alpha105-clean
      EXPECTED_CERT_SHA256: df90b01217fbbf973b65865be64bfede267e17fec611c355b814585dfba83f00
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, sign and verify the one update APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "$(printenv "$key")" ]; then
              echo "::error::Missing signing secret: $key"; exit 1
            fi
          done
          keystore="$RUNNER_TEMP/zavro-video-results-v1200.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          export NIRA_SIGNING_STORE_FILE="$keystore"
          export NIRA_SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          export NIRA_SIGNING_KEY_ALIAS="$KEY_ALIAS"
          export NIRA_SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
          ./gradlew :app:assembleDebug --console=plain
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [[ "${apks[0]}" != *arm64-v8a* ]]; then
            echo "::error::Expected exactly one arm64-v8a APK"; exit 1
          fi
          bash scripts/verify-update-apk.sh "${apks[0]}" \
            "$EXPECTED_PACKAGE" "$EXPECTED_VERSION_CODE" "$EXPECTED_VERSION_NAME" "$EXPECTED_CERT_SHA256"
          sha256sum "${apks[0]}" > "${apks[0]}.sha256"
          {
            echo "source_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "package=$EXPECTED_PACKAGE"
            echo "version_code=$EXPECTED_VERSION_CODE"
            echo "version_name=$EXPECTED_VERSION_NAME"
            echo "abi=arm64-v8a"
            echo "signer_sha256=$EXPECTED_CERT_SHA256"
            echo "apk_sha256=$(cut -d' ' -f1 "${apks[0]}.sha256")"
            echo "device_test=NOT_TESTED"
            echo "installation=NOT_EXECUTED"
          } > app/build/outputs/apk/debug/T03_LANDSCAPE_PROVENANCE.txt
      - name: Upload verified APK, SHA256 and provenance
        uses: actions/upload-artifact@v4
        with:
          name: zavro-clean-t03-v1200-v1200-signed-arm64-update
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/debug/*arm64-v8a*.apk.sha256
            app/build/outputs/apk/debug/T03_LANDSCAPE_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
  verify-all:
    needs: [authorized-source, regressions, signed-update]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify source, regressions, signed APK
        env:
          SOURCE_GATE: ${{ needs.authorized-source.result }}
          SHARED_GATE: ${{ needs.regressions.result }}
          APK_GATE: ${{ needs.signed-update.result }}
        run: |
          test "$SOURCE_GATE" = success
          test "$SHARED_GATE" = success
          test "$APK_GATE" = success
          echo "Complete: all required checks, signed and verified APK; device NOT_TESTED."
