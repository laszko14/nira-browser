name: Zavro Controlled Code Editor Apply
on:
  push:
    branches:
      - tools/zavro-development-system-stage1-20261027
    paths:
      - 'devtools/edit-probes/*.json'
permissions: {}
concurrency:
  group: zavro-controlled-editor-one-at-a-time
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'laszko14/nira-browser' && github.actor == 'laszko14'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.edit.outputs.sha }}
      variant: ${{ steps.edit.outputs.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Guard editor parser, protected paths and branch CAS
        run: node --test devtools/tests/code-editor.test.mjs devtools/tests/apply-sandbox-edit.test.mjs
      - name: Apply exactly one authorized file edit on isolated branch
        id: edit
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node devtools/apply-sandbox-edit.mjs
  verify:
    needs: apply
    if: needs.apply.result == 'success' && needs.apply.outputs.variant == 'mpv'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Run only the automator-inserted JUnit test (no APK)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --tests com.prirai.android.nira.devtools.ZavroAutomatedEditorTest \
            --no-daemon --max-workers=2 --console=plain
          echo "ZAVRO_AUTO_EDITOR_KOTLIN_TEST_PASS" >> "$GITHUB_STEP_SUMMARY"
