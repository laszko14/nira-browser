name: Zavro Clean audit60 stage 18C - download probe cancellation regression (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-audit60-stage18c-probe-cancellation-20261031
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit60-stage18c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Preview 18A/18B regressions (fast gate)
        run: node --test app/src/test/js/preview-assist-audit60.test.cjs app/src/test/js/preview-assist-stage18b.test.cjs
      - name: Download probe 18C regression (fast gate)
        run: ./gradlew :app:testDebugUnitTest --tests "com.prirai.android.nira.audit.DownloadProbeGateTest" --console=plain
      - name: Full Kotlin JVM and Robolectric regressions
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Compile instrumented tests without assembling APK
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain
      - name: Full WebExtension JS regressions
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit60-stage18c-test-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
