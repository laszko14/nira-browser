name: Zavro ChatGPT connector probe
on:
  push:
    branches:
      - tools/zavro-development-system-stage1-20261027
    paths:
      - 'devtools/control-probes/*.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: zavro-chat-connector-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'laszko14/nira-browser'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate direct ChatGPT connector request (no build, no secrets)
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync, appendFileSync} from 'node:fs';
          const expectedBranch = 'refs/heads/tools/zavro-development-system-stage1-20261027';
          if (process.env.GITHUB_REF !== expectedBranch) throw Error('WRONG_BRANCH');
          const before = process.env.BEFORE_SHA || '';
          const after = process.env.AFTER_SHA || '';
          if (!/^[0-9a-f]{40}$/.test(before) || !/^[0-9a-f]{40}$/.test(after)) throw Error('INVALID_COMMIT');
          const diff = execFileSync('git',['diff','--name-status','--no-renames',before,after],{encoding:'utf8'});
          const lines = diff.trim().split('\n').filter(Boolean);
          if (lines.length !== 1) throw Error('EXPECTED_ONE_FILE_ONLY');
          const [status, file] = lines[0].split('\t');
          if (status !== 'A' || !/^devtools\/control-probes\/[a-z0-9-]+\.json$/.test(file)) throw Error('UNAPPROVED_PATH');
          const request = JSON.parse(readFileSync(file,'utf8'));
          if (request.schema_version !== 1 || request.kind !== 'probe' ||
              request.repo !== 'laszko14/nira-browser' ||
              request.purpose !== 'stage3-chatgpt-connector-verification' ||
              request.build_requested !== false) throw Error('INVALID_PROBE');
          console.log('ZAVRO_CONNECTOR_PROBE_PASS');
          console.log('BUILD_DISPATCHED=false');
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Zavro connector probe: PASS\n\nNo Android build or secrets accessed.\n');
          }
          NODE
      - name: Run Build Control and bridge security tests (no Android)
        run: node --test devtools/tests/build-control.test.mjs devtools/tests/build-request-validator.test.mjs devtools/tests/report-build.test.mjs
      - name: Run Stage 4 ZIP verifier security tests (no APK download)
        run: python3 -m unittest discover -s devtools/tests -p test_verify_apk_artifact.py -v
      - name: Smart CI selection and audit tests (no Gradle)
        run: node --test devtools/tests/smart-ci.test.mjs devtools/tests/smart-ci-fast-request.test.mjs
      - name: Validate pinned Clean and MPV build metadata (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node devtools/smart-ci.mjs audit clean > "$RUNNER_TEMP/smart-ci-clean.json"
          node devtools/smart-ci.mjs audit mpv > "$RUNNER_TEMP/smart-ci-mpv.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const base=process.env.RUNNER_TEMP;
          for(const variant of ['clean','mpv']){
            const a=JSON.parse(readFileSync(base+'/smart-ci-'+variant+'.json','utf8'));
            if(a.variant!==variant||a.static_audit!=='PASS'||
              a.android_compilation_executed!==false||a.gradle_features.cache!==true||
              a.gradle_features.parallel!==true||a.gradle_features.configuration_cache!==true){
              throw Error('SMART_CI_AUDIT_FAILED_'+variant);
            }
          }
          console.log('SMART_CI_VARIANT_AUDIT_PASS (read-only)');
          NODE
      - name: Classify a real historical Kotlin-test-only commit difference (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/laszko14/nira-browser/compare/299db5fe94ff959bcca6c3a0726d8327ecba6cad...3330a0b3a057008886fde392f788a1941e0dfb84' > "$RUNNER_TEMP/smart-ci-diff.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {chooseTests} from './devtools/smart-ci.mjs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/smart-ci-diff.json','utf8'));
          const config=JSON.parse(readFileSync('devtools/build-control.json','utf8'));
          if(data.status!=='ahead'||data.files?.length!==1)throw Error('UNEXPECTED_HISTORICAL_DIFF');
          const result=chooseTests(data.files,'clean',config);
          if(result.tasks.join(',')!=='kotlin-unit'||result.requires_explicit_android_approval!==true||
             result.tasks.includes('android-build')||result.android_tasks_blocked!==true)
            throw Error('SMART_CI_KOTLIN_TEST_SELECTION_ERROR');
          console.log('SMART_CI_REAL_DIFF_PASS: Kotlin unit test only; no APK compile');
          NODE
      - name: Test Zavro Code Inspector logic and privacy guards (no Android)
        run: node --test devtools/tests/code-inspector.test.mjs
      - name: Read live Codex PR #84 #85 #88 #89 and report potential overlap only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node devtools/code-inspector.mjs audit-prs > "$RUNNER_TEMP/codex-readonly.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/codex-readonly.json','utf8'));
          const p=r.overlap_pairs.find(x=>x.pr_a===84&&x.pr_b===85);
          const q=r.overlap_pairs.find(x=>x.pr_a===88&&x.pr_b===89);
          if(r.checked_prs.length!==4 || !p || p.overlap_count<2 || !q || q.overlap_count<1 ||
            !q.historical_chain_detected || r.mutation_allowed!==false ||
            r.merge_conflicts_claimed!==false)throw Error('CODEX_AUDIT_NOT_VERIFIED');
          console.log('ZAVRO_CODE_INSPECTOR_LIVE_PR_PASS: potential overlap, no merge, no build');
          NODE
      - name: Confirm Kotlin dependency graph on pinned Clean sources (GET only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha=3330a0b3a057008886fde392f788a1941e0dfb84
          for pair in 'app/src/main/java/com/prirai/android/nira/BrowserFragment.kt|browser.kt' 'app/src/main/java/com/prirai/android/nira/media/MediaFloatingUi.kt|floating.kt'; do
            path="${pair%%|*}"
            name="${pair##*|}"
            gh api "repos/laszko14/nira-browser/contents/$path?ref=$sha" --jq '.content' | base64 --decode > "$RUNNER_TEMP/$name"
          done
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {dependencyGraph} from './devtools/code-inspector.mjs';
          const fragment='app/src/main/java/com/prirai/android/nira/BrowserFragment.kt';
          const floating='app/src/main/java/com/prirai/android/nira/media/MediaFloatingUi.kt';
          const root=process.env.RUNNER_TEMP;
          const sources={[fragment]:readFileSync(root+'/browser.kt','utf8'),[floating]:readFileSync(root+'/floating.kt','utf8')};
          const graph=dependencyGraph(sources,[floating]);
          if(!graph.edges.some(e=>e.from===fragment&&e.to===floating)||
             !graph.potentially_affected.includes(fragment)||graph.edits_applied!==false)
            throw Error('LIVE_KOTLIN_GRAPH_NOT_VERIFIED');
          console.log('ZAVRO_CODE_INSPECTOR_REAL_IMPORT_GRAPH_PASS (no Kotlin compilation)');
          NODE
      - name: Validate TestLab TXT standalone CLI with synthetic private-safe sample
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {mkdtempSync,writeFileSync,readFileSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {execFileSync} from 'node:child_process';
          const temp=mkdtempSync(join(tmpdir(),'zavro-testlab-'));
          try {
            const path=join(temp,'report.txt');
            writeFileSync(path,'Zavro TestLab • COMPLEX • 0.5.22-alpha79-clean (1174)\\nStan: COMPLETED; rzeczywisty pomiar: 60.000 s\\nn=1000, jank=25 (2.5%), średnia=12 ms, max=48 ms\\n'.replaceAll('\\n','\n'));
            const result=JSON.parse(execFileSync('node',['devtools/code-inspector.mjs','testlab',path],{encoding:'utf8'}));
            if(result.test_type!=='COMPLEX'||result.window_jank_percent!==2.5||result.gecko_fps_measured!==false)throw Error('CLI_REPORT_NOT_VERIFIED');
            console.log('ZAVRO_TESTLAB_CLI_PASS (no raw report in logs)');
          }finally{rmSync(temp,{recursive:true,force:true});}
          NODE
      - name: Inspect existing signed Clean v1174 Actions run (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node devtools/report-build.mjs --run 40462413839 --variant clean > "$RUNNER_TEMP/zavro-stage4-report.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/zavro-stage4-report.json','utf8'));
          if (report.run_id!==40462413839 || report.commit_sha!=='3330a0b3a057008886fde392f788a1941e0dfb84' ||
              report.state!=='VERIFICATION_REQUIRED' || report.artifact!==null || report.artifact_observed?.artifact_id!==12714733371 ||
              report.build_started_by_reporter!==false || report.independently_inspected_apk_bytes!==false) {
            throw Error('STAGE4_REPORT_NOT_VERIFIED');
          }
          console.log('STAGE4_LIVE_METADATA_PASS (CI log intentionally not supplied; no build)');
          NODE
