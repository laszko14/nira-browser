name: Zavro Clean audit60 stage 2 - bookmarks lifecycle regressions (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-audit60-stage2-bookmark-dialog-lifecycle-20261030
    paths:
      - '.github/workflows/zavro-audit60-stage2-regression.yml'
      - 'app/src/main/java/com/prirai/android/nira/browser/bookmark/ui/**'
      - 'app/src/test/java/com/prirai/android/nira/browser/bookmark/ui/**'
      - 'docs/audits/zavro-clean-repair/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zavro-audit60-stage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Bookmark lifecycle, all Kotlin JVM and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Full WebExtension JavaScript regression suite
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload diagnostic reports (never APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit60-stage2-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
# Explicitly no assembleDebug, keystore, signing, artifact APK or release.
