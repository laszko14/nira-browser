name: Zavro Clean audit60 G3B - native evidence source-only (no APK)

on:
  push:
    branches:
      - test/zavro-clean-post19-gecko-g3b-native-evidence-20261031
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit60-gecko-g3b
  cancel-in-progress: true

jobs:
  source-and-regression-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enforce isolated test and debug-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 8515ab00bf7b95cd0c62b28ab466d545c080436c "$GITHUB_SHA" | while IFS= read -r file; do
            case "$file" in
              app/src/debug/java/com/prirai/android/nira/diagnostics/geckog3/GeckoG3NativeFacts.kt|\
              app/src/test/java/com/prirai/android/nira/diagnostics/geckog3/GeckoG3NativeFactsTest.kt|\
              app/src/androidTest/java/com/prirai/android/nira/diagnostics/geckog3/GeckoG3NativeEvidenceTest.kt|\
              docs/audits/zavro-clean-repair/GECKOVIEW_DEVICE_VERIFICATION_G3B.md|\
              .github/workflows/zavro-audit60-gecko-native-g3b.yml) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done
      - name: Preserve frozen 19B 60/60 status matrix
        run: node scripts/verify-audit60-stage19b.cjs
      - name: G3 and G3B JVM diagnostic tests
        run: ./gradlew :app:testDebugUnitTest --tests 'com.prirai.android.nira.diagnostics.geckog3.*' --console=plain
      - name: Compile AndroidTest Kotlin WITHOUT APK
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain
      - name: Full JS WebExtension regression
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
