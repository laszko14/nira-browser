name: Zavro shared regression checks (NO APK)
on:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript WebExtension regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Report actual source checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF commit=$GITHUB_SHA"
          echo "checked-out=$(git rev-parse HEAD)"
          echo "pr-head=${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Full JavaScript WebExtension protocol tests
        run: node --test app/src/test/js/*.test.cjs

  unit:
    name: Kotlin and Robolectric JVM tests
    needs: javascript
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Record tested checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Full JVM and Robolectric suite
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Upload JVM test reports (never APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-unit-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

  android-test-compile:
    name: Android instrumentation test compilation (no device, no APK packaging)
    needs: javascript
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Record tested checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compile Android instrumentation Kotlin tests only
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain

  lint:
    name: Android lint with regression baseline
    needs: javascript
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Record lint source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Block any increase in lint findings relative to real stage 4 baseline
        run: node scripts/lint-regression.cjs app/build/reports/lint-results-debug.xml
      - name: Upload lint evidence (never APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-lint-reports
          path: app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
