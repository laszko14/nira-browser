name: Zavro Video Search v1191 signed ARM64 artifact verification

# Explicit user-authorized compilation. The earlier JUnit run found 16/1035
# failures; this limited workflow does not relabel those failures as PASS.
on:
  push:
    branches:
      - feat/zavro-clean-video-search-20261029
    paths:
      - '.github/workflows/video-search-build-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-arm64:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[authorized-video-search-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Build and verify update-safe signed arm64 debug APK v1191
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing stable signing secret: ${key}"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/zavro-update-key.p12"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          export NIRA_SIGNING_STORE_FILE="$key_path"
          export NIRA_SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          export NIRA_SIGNING_KEY_ALIAS="$KEY_ALIAS"
          export NIRA_SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
          ./gradlew assembleDebug --console=plain
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*arm64-v8a*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one arm64-v8a APK, found ${#apks[@]}"
            exit 1
          fi
          bash scripts/verify-update-apk.sh "${apks[0]}" \
            com.prirai.android.nira.debug 1191 0.5.22-alpha96-clean \
            df90b01217fbbf973b65865be64bfede267e17fec611c355b814585dfba83f00

      - name: Upload signed ARM64 APK v1191
        uses: actions/upload-artifact@v4
        with:
          name: zavro-video-search-v1191-arm64-update
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check video-search WebExtension JavaScript regression
        run: node --test app/src/test/js/*.test.cjs

      - name: Android lint diagnostics
        run: ./gradlew lintDebug --console=plain

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zavro-video-search-v1191-lint
          path: app/build/reports/lint-results-debug*
          if-no-files-found: warn
