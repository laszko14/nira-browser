name: GeckoView and TestLab instrumentation
on:
  push:
    branches: [feat/zavro-x-mpv-v1164-gecko-advanced-discovery, feat/zavro-x-mpv-v1165-testlab-diagnostics]
  pull_request:
    branches: ['**']
    paths:
      - 'app/src/main/assets/extensions/nira-media-detector/**'
      - 'app/src/main/java/com/prirai/android/nira/media/**'
      - 'app/src/main/java/com/prirai/android/nira/display/**'
      - 'app/src/main/java/com/prirai/android/nira/BrowserApp.kt'
      - 'app/src/main/java/com/prirai/android/nira/BrowserFragment.kt'
      - 'app/src/main/java/com/prirai/android/nira/diagnostics/testlab/**'
      - 'app/src/androidTest/**'
      - 'app/src/geckoDiscoveryTest/**'
      - '.github/workflows/gecko-discovery.yml'
      - 'app/build.gradle'
  workflow_dispatch:
    inputs:
      suite:
        description: Instrumentation suite (all keeps the full release regression)
        type: choice
        default: all
        options: [all, testlab]
jobs:
  gecko:
    if: github.event_name != 'push' || (contains(github.event.head_commit.message, '[gecko-baseline]') || contains(github.event.head_commit.message, '[gecko-test]') || contains(github.event.head_commit.message, '[gecko-spa]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      # A focused WIP diagnosis never replaces the full PR / final suite.
      GECKO_TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'testlab' && 'com.prirai.android.nira.diagnostics.testlab.TestLabDeviceTest' || github.event_name == 'push' && contains(github.event.head_commit.message, '[gecko-spa]') && 'com.prirai.android.nira.media.GeckoDiscoveryDeviceTest#spaPushStateWithoutMutation,com.prirai.android.nira.media.GeckoDiscoveryDeviceTest#spaReplaceStateWithoutMutation' || 'com.prirai.android.nira.media.GeckoDiscoveryDeviceTest,com.prirai.android.nira.diagnostics.testlab.TestLabDeviceTest,com.prirai.android.nira.browser.tabs.TabGroupRoomDeviceTest,com.prirai.android.nira.media.VideoTilesDeviceTest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real GeckoView / shipped WebExtension / native repository
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            ./gradlew connectedDebugAndroidTest -PgeckoDiscoveryAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class="$GECKO_TEST_FILTER" --console=plain -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --max-workers=2
            mkdir -p app/build/reports/androidTests/reference-ui
            adb exec-out run-as com.prirai.android.nira.mpv cat files/reference-panel-portrait.png > app/build/reports/androidTests/reference-ui/reference-panel-portrait.png
            adb exec-out run-as com.prirai.android.nira.mpv cat files/reference-panel-landscape.png > app/build/reports/androidTests/reference-ui/reference-panel-landscape.png
            adb exec-out run-as com.prirai.android.nira.mpv cat files/reference-settings-portrait.png > app/build/reports/androidTests/reference-ui/reference-settings-portrait.png
      - name: Upload real Android instrumentation reports (no APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gecko-discovery-device-results
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
