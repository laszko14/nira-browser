name: Zavro video search P3-P7 regressions (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-video-search-audit-20261029
    paths:
      - '.github/workflows/video-search-p3-regression.yml'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchBridgeController.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchNormalWorker*.kt'
      - 'app/src/main/java/com/prirai/android/nira/components/Components.kt'
      - 'app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchNormalWorker*.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchNormalRunGate.kt'
      - 'app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchNormalRunGateTest.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchDao.kt'
      - 'app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchConfigurationRevisionTest.kt'
      - 'app/src/test/java/com/prirai/android/nira/videosearch/MyVideoSitesManagementTest.kt'
      - 'app/src/main/assets/extensions/zavro-video-search/content.js'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchBridgeProtocol.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchVisiblePageCollector.kt'
      - 'app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchPageBatchProtocolTest.kt'
      - 'app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchVisiblePageCollectorTest.kt'
      - 'app/src/test/js/video-search-p6-batches.test.cjs'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchRepository.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchMultiRunJournal.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchModels.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchResultsPresenter.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchResultsActivity.kt'
      - 'app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchAggregateBudgetTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-search-p3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v5
      - name: P3-P7 targeted worker configuration and pagination regression
        run: |
          ./gradlew :app:testDebugUnitTest --console=plain \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchNormalWorkerLeaseTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPrivateWorkerLeaseTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchWorkerVerificationTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchNormalRunGateTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchConfigurationRevisionTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchAutoConfigurationTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchManualConfigurationTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchConfigurationHealthTest' \
            --tests 'com.prirai.android.nira.videosearch.MyVideoSitesManagementTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPageBatchProtocolTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchVisiblePageCollectorTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPaginationCollectorTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPaginationProtocolTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchAggregateBudgetTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchMultiRunJournalTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPrivateGroupAccessTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchTransactionalTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchResultsPresenterTest'
      - name: All JVM Robolectric regression tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: JS WebExtension regression tests
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-search-p3-p4-p5-p6-p7-tests
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
