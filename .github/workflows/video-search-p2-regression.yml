name: Zavro private epoch P2 regression tests (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-video-search-audit-20261029
    paths:
      - '.github/workflows/video-search-p2-regression.yml'
      - 'app/src/main/java/com/prirai/android/nira/BrowserActivity.kt'
      - 'app/src/main/java/com/prirai/android/nira/components/Components.kt'
      - 'app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchPrivate*.kt'
      - 'app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchPrivate*.kt'
      - 'app/src/test/java/com/prirai/android/nira/browser/profile/ProfileMigrationTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-epoch-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v5
      - name: P2 targeted Kotlin and Robolectric tests
        run: |
          ./gradlew :app:testDebugUnitTest --console=plain \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPrivateTabLifecycleMiddlewareTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPrivateSessionRegistryTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPrivateSitesAccessTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPrivateWorkerLeaseTest' \
            --tests 'com.prirai.android.nira.videosearch.VideoSearchPrivateJobGateTest' \
            --tests 'com.prirai.android.nira.browser.profile.ProfileMigrationTest'
      - name: All Kotlin unit and Robolectric regression tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: All WebExtension JS regression tests
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint (report may contain existing findings)
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload test and lint reports (never APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-epoch-p2-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
