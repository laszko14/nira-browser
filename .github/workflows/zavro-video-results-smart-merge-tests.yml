name: Zavro Clean smarter video results merging (NO APK)
on:
  push:
    branches:
      - fix/zavro-clean-video-results-smart-merge-20261101
    paths:
      - app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchResultsMerge.kt
      - app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchResultsMergeTest.kt
      - docs/AI_HANDOFF.md
      - .github/workflows/zavro-video-results-smart-merge-tests.yml
permissions:
  contents: read
concurrency:
  group: zavro-smart-merge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce exact commit, approved scope and no release build
        shell: bash
        run: |
          set -euo pipefail
          base=e9d1f76d085cdff8432d92a880d6df76adcd3f7d
          test "$GITHUB_REF_NAME" = 'fix/zavro-clean-video-results-smart-merge-20261101'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed"
          test -s "$RUNNER_TEMP/changed"
          while IFS= read -r changed; do
            case "$changed" in
              app/src/main/java/com/prirai/android/nira/videosearch/VideoSearchResultsMerge.kt|app/src/test/java/com/prirai/android/nira/videosearch/VideoSearchResultsMergeTest.kt|.github/workflows/zavro-video-results-smart-merge-tests.yml|docs/AI_HANDOFF.md) ;;
              *) echo "::error::Unexpected changed file: $changed"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changed"
          node --test scripts/check-ci-workflows.test.cjs
          git diff --check "$base" "$GITHUB_SHA"
  regressions:
    name: Required shared code regression gates (NO APK)
    uses: ./.github/workflows/zavro-tests-reusable.yml
    permissions:
      contents: read
  verify-all:
    needs: [scope, regressions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify successful source and all shared regressions
        env:
          SCOPE: ${{ needs.scope.result }}
          GATES: ${{ needs.regressions.result }}
        run: |
          test "$SCOPE" = success
          test "$GATES" = success
          echo "CODE_VERIFIED gates only. DEVICE_NOT_TESTED, APK_NOT_BUILT."
