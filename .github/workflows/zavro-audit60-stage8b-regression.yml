name: Zavro Clean audit60 stage 8B - profile scope and addon serialization (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-audit60-stage8b-profile-scope-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zavro-audit60-stage8b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Full Kotlin JVM and Robolectric
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Full WebExtension JavaScript
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload test and lint diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit60-stage8b-regression
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
# No APK, merge, assemble or signing.
