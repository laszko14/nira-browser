name: Zavro Clean audit60 stage 4 - session exit barrier (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-audit60-stage4-session-exit-barrier-20261030
    paths:
      - '.github/workflows/zavro-audit60-stage4-regression.yml'
      - 'app/src/main/java/com/prirai/android/nira/BrowserActivity.kt'
      - 'app/src/main/java/com/prirai/android/nira/BrowserApp.kt'
      - 'app/src/main/java/com/prirai/android/nira/browser/TaskExitSaveBarrier.kt'
      - 'app/src/test/java/com/prirai/android/nira/browser/TaskExitSaveBarrierTest.kt'
      - 'docs/audits/zavro-clean-repair/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zavro-audit60-stage4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Complete Kotlin JVM and Robolectric test suite
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Complete WebExtension JavaScript suite
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload diagnostic reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit60-stage4-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
# Explicitly no APK build, signing, keystore or publishing.
