name: Zavro Stage 8 Final Acceptance
on:
  push:
    branches:
      - tools/zavro-development-system-stage1-20261027
    paths:
      - 'devtools/acceptance-probes/*.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: zavro-stage8-final-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.repository == 'laszko14/nira-browser' && github.actor == 'laszko14'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject unsafe event and any changed file outside an acceptance request
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const before=process.env.BEFORE_SHA,after=process.env.GITHUB_SHA;
          if(!/^[a-f0-9]{40}$/.test(before)|| !/^[a-f0-9]{40}$/.test(after)||
            process.env.GITHUB_REPOSITORY!=='laszko14/nira-browser'||
            process.env.GITHUB_REF!=='refs/heads/tools/zavro-development-system-stage1-20261027'||
            process.env.GITHUB_ACTOR!=='laszko14') throw Error('STAGE8_UNAUTHORIZED_EVENT');
          const diff=execFileSync('git',['diff','--name-status','--no-renames',before,after],{encoding:'utf8'}).trim().split('\n');
          if(diff.length!==1 || !/^A\tdevtools\/acceptance-probes\/[a-z0-9-]+\.json$/.test(diff[0]))
            throw Error('STAGE8_UNSAFE_CHANGED_FILES');
          const file=diff[0].split('\t')[1];
          const x=JSON.parse(readFileSync(file,'utf8'));
          const expected=['build_requested','kind','purpose','repo','schema_version'];
          if(Object.keys(x).sort().join(',')!==expected.join(',')||x.build_requested!==false||
            x.kind!=='final-acceptance'||x.purpose!=='read-only-security-recovery-audit'||
            x.repo!=='laszko14/nira-browser'||x.schema_version!==1)
            throw Error('STAGE8_INVALID_ACCEPTANCE_REQUEST');
          console.log('STAGE8_ACCEPTANCE_TRIGGER_VALID; Android build forbidden');
          NODE
      - name: Execute all Node suites including end-to-end orchestration
        shell: bash
        run: |
          set -euo pipefail
          node --test devtools/tests/*.test.mjs
      - name: Execute all Python suites and offline Stage 1 policy validation
        shell: bash
        run: |
          set -euo pipefail
          python3 devtools/check_policy.py
          python3 -m unittest discover -s devtools/tests -p 'test_*.py' -v
      - name: Validate protected refs, failure evidence and checkpoint artifacts using GitHub GET only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node devtools/final-acceptance.mjs > "$RUNNER_TEMP/zavro-stage8-final.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/zavro-stage8-final.json','utf8'));
          if(p.static.static_controls!=='PASS'||p.summary.audit!=='STAGE8_DIAGNOSTIC_ACCEPTED_WITH_OPEN_GATES'||
             p.summary.scenarios_confirmed.length!==7||p.summary.android_build_started!==false||
             p.summary.apk_generated!==false||p.summary.signed_android_dispatch_tested!==false||
             p.summary.stage3_dispatch_admin_gated!==true)throw Error('STAGE8_UNVERIFIED_FINAL_STATE');
          console.log('STAGE8_LIVE_EVIDENCE_PASS; all seven historical scenarios verified');
          NODE
      - name: Validate continuing Code Editor, cross-run recovery and gated signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const repo='repos/laszko14/nira-browser/';
          const api=route=>JSON.parse(execFileSync('gh',['api',repo+route],{encoding:'utf8'}));
          const refs={
            main:'0823f24eb48e2eefbe38c7616bc1d55e73917b37',
            'feat/zavro-v1174-clean-video-metadata':'3330a0b3a057008886fde392f788a1941e0dfb84',
            'feat/zavro-x-mpv-v1167-reference-video-panel':'d63f414acecae84c3507c3f4bb998e690281b91e',
            'tools/zavro-edit-clean-20261027':'d9c233bbf886d3fb2d320fe118f1d2768ca46092',
            'tools/zavro-edit-mpv-20261027':'e6e8f71eb67ee61f8bfe67b45a25ba9f2b4149a0'
          };
          for(const [branch,sha] of Object.entries(refs)){
            if(api('git/ref/heads/'+branch).object.sha!==sha)throw Error('PROTECTED_OR_SANDBOX_REF_MOVED_'+branch);
          }
          const verified={
            editor_apply:40479677437,
            partial_restore:40480182477,
            signed_sandbox_preflight:40479200630,
            real_kotlin_lint:40477361547
          };
          for(const [key,id] of Object.entries(verified)){
            const run=api('actions/runs/'+id);
            if(run.status!=='completed'||run.conclusion!=='success')throw Error('RUN_NOT_SUCCESS_'+key);
          }
          const editor=api('actions/runs/'+verified.editor_apply+'/jobs?per_page=100').jobs;
          if(editor.length!==2|| !['apply','verify'].every(name=>editor.some(x=>x.name===name&&x.conclusion==='success')))
            throw Error('EDITOR_COMMIT_OR_JUNIT_NOT_VERIFIED');
          const build=api('actions/runs/'+verified.signed_sandbox_preflight+'/jobs?per_page=100').jobs;
          if(!build.some(x=>x.name==='preflight'&&x.conclusion==='success')||
             !build.some(x=>x.name==='build'&&x.conclusion==='skipped'))
            throw Error('SIGNED_BUILD_GATE_NOT_VERIFIED');
          const signed=readFileSync('.github/workflows/zavro-sandbox-signed-1175.yml','utf8');
          if(!signed.includes("vars.ZAVRO_ALLOW_SIGNED_BUILD_DISPATCH == 'ENABLED_BY_REPOSITORY_OWNER'")||
             !signed.includes('SIGNED_APK_ARTIFACT_ALREADY_EXISTS'))
            throw Error('SIGNED_WORKFLOW_SECURITY_GATE_CHANGED');
          const report={
            outcome:'DIAGNOSTIC_AND_SANDBOX_EDITOR_VERIFIED',
            refs,validated_runs:verified,automatic_edit_committed:true,
            isolated_mpv_junit_compiled:true,
            cross_run_partial_fail_closed:true,
            stable_signed_apk_built:false,
            signed_build_skipped_due_to_admin_condition:true,
            release_created:false,
            next_requirement:'repository-owner-enabled signing gate for sandbox APK'
          };
          const old=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/zavro-stage8-final.json','utf8'));
          writeFileSync(process.env.RUNNER_TEMP+'/zavro-stage8-final.json',JSON.stringify({...old,continuation:report},null,2)+'\n');
          console.log('POST_STAGE8_INTEGRATED_ACCEPTANCE_PASS');
          NODE
      - name: Preserve small sanitized audit result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zavro-stage8-final-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/zavro-stage8-final.json
          retention-days: 14
          if-no-files-found: error
