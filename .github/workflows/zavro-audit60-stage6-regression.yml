name: Zavro Clean audit60 stage 6 - private Sync and favicon (no APK)

on:
  push:
    branches:
      - fix/zavro-clean-audit60-stage6-private-sync-favicon-20261030
    paths:
      - '.github/workflows/zavro-audit60-stage6-regression.yml'
      - 'app/src/main/java/com/prirai/android/nira/browser/sync/**'
      - 'app/src/main/java/com/prirai/android/nira/settings/fragment/SyncSettingsFragment.kt'
      - 'app/src/main/java/com/prirai/android/nira/components/toolbar/modern/PortraitNativeTabStrip.kt'
      - 'app/src/main/java/com/prirai/android/nira/utils/FaviconLoader.kt'
      - 'app/src/test/java/com/prirai/android/nira/browser/sync/**'
      - 'app/src/test/java/com/prirai/android/nira/utils/FaviconPrivateCacheTest.kt'
      - 'docs/audits/zavro-clean-repair/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zavro-audit60-stage6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Complete Kotlin JVM and Robolectric privacy regressions
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Complete WebExtension JavaScript regressions
        run: node --test app/src/test/js/*.test.cjs
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload diagnostics only - no APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit60-stage6-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
# Explicitly no APK, signing, assemble or merge.
