name: Zavro Development System Orchestrator Diagnostics
on:
  push:
    branches:
      - tools/zavro-development-system-stage1-20261027
    paths:
      - 'devtools/orchestrator-probes/*.json'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: zavro-stage7-diagnostic
  cancel-in-progress: false

jobs:
  no-build-scenario:
    if: github.repository == 'laszko14/nira-browser' && github.actor == 'laszko14'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test deterministic stage transitions, failure gates and resume
        run: node --test devtools/tests/orchestrate.test.mjs
      - name: Run authenticated read-only orchestration on one immutable variant
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only --no-renames "$BEFORE_SHA" "$GITHUB_SHA")"
          [[ "$changed" =~ ^devtools/orchestrator-probes/[a-z0-9-]+\.json$ ]] || { echo 'UNAUTHORIZED_CHANGE'; exit 1; }
          node devtools/orchestrate.mjs run "$changed" --checkpoint "$RUNNER_TEMP/zavro-stage7-state.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const dir=process.env.RUNNER_TEMP;
          const state=JSON.parse(readFileSync(dir+'/zavro-stage7-state.json','utf8'));
          const report=JSON.parse(readFileSync(dir+'/zavro-stage7-state.report.json','utf8'));
          if(state.stage!=='REPORTED'||state.revision!==6||state.events.length!==6||
            report.status!=='DIAGNOSTIC_ONLY_TEST_VERIFIED'||report.build_started!==false||
            report.apk_created!==false||report.full_android_ci_verified!==false||
            report.implementation_applied!==false||report.checkpoint_checksum!==state.checksum){
            throw Error('UNSAFE_ORCHESTRATOR_OUTCOME');
          }
          console.log('STAGE7_ORCHESTRATOR_PASS: read-only, tested JS only, no APK');
          NODE
      - name: Replay completed checkpoint without executing prior steps
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff --name-only --no-renames "$BEFORE_SHA" "$GITHUB_SHA")"
          before="$(sha256sum "$RUNNER_TEMP/zavro-stage7-state.json" "$RUNNER_TEMP/zavro-stage7-state.report.json")"
          node devtools/orchestrate.mjs run "$request" --checkpoint "$RUNNER_TEMP/zavro-stage7-state.json"
          after="$(sha256sum "$RUNNER_TEMP/zavro-stage7-state.json" "$RUNNER_TEMP/zavro-stage7-state.report.json")"
          [ "$before" = "$after" ] || { echo 'CHECKPOINT_REPLAY_MUTATED'; exit 1; }
          echo 'ZAVRO_STAGE7_IDEMPOTENT_REPLAY_PASS'
      - name: Preserve completed or partial checkpoint and sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zavro-stage7-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zavro-stage7-state.json
            ${{ runner.temp }}/zavro-stage7-state.report.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
      - name: Restore the uploaded checkpoint to a clean location
        uses: actions/download-artifact@v4
        with:
          name: zavro-stage7-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/zavro-restored
      - name: Validate restored checkpoint and replay without duplicate work
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/zavro-restored/zavro-stage7-state.json"
          cmp "$RUNNER_TEMP/zavro-stage7-state.json" "$RUNNER_TEMP/zavro-restored/zavro-stage7-state.json"
          request="$(git diff --name-only --no-renames "$BEFORE_SHA" "$GITHUB_SHA")"
          before="$(sha256sum "$RUNNER_TEMP/zavro-restored/zavro-stage7-state.json")"
          node devtools/orchestrate.mjs run "$request" --checkpoint "$RUNNER_TEMP/zavro-restored/zavro-stage7-state.json"
          after="$(sha256sum "$RUNNER_TEMP/zavro-restored/zavro-stage7-state.json")"
          [ "$before" = "$after" ] || { echo 'RESTORE_MUTATED'; exit 1; }
          echo 'ZAVRO_STAGE7_ARTIFACT_RESUME_PASS'
