name: Zavro Clean GV-G4C - signed arm64 evidence APK (BUILD ONLY)

on:
  push:
    branches:
      - build/zavro-clean-post19-gecko-g4c-update-v1196-20261101

permissions:
  contents: read

concurrency:
  group: zavro-gecko-g4c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-build-no-install:
    # The separate, explicit user instruction "Kompiluj" authorizes only
    # this commit with the marker. No workflow_dispatch or install action.
    if: contains(github.event.head_commit.message, '[authorized-g4c-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_PACKAGE: com.prirai.android.nira.debug
      EXPECTED_VERSION_CODE: '1196'
      EXPECTED_VERSION_NAME: 0.5.22-alpha101-clean
      EXPECTED_CERT_SHA256: df90b01217fbbf973b65865be64bfede267e17fec611c355b814585dfba83f00

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict source change to the two authorized version fields
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 709f80e8d0ef24be5f14352e0fd1f99ddc301aa7 "$GITHUB_SHA" > "$RUNNER_TEMP/g4c-changed"
          test -s "$RUNNER_TEMP/g4c-changed"
          while IFS= read -r path; do
            case "$path" in
              app/build.gradle|.github/workflows/apk-release.yml|app/src/test/js/release-contract-stage19a.test.cjs|.github/workflows/zavro-audit60-gecko-update-g4c.yml|docs/audits/zavro-clean-repair/GECKOVIEW_DEVICE_VERIFICATION_G4C.md) ;;
              *) echo "::error::G4C out-of-scope change: $path"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/g4c-changed"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Frozen audit, exact version-only update contract, and evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-audit60-stage19b.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const baseline = cp.execFileSync('git', ['show', '709f80e8d0ef24be5f14352e0fd1f99ddc301aa7:app/build.gradle'], { encoding: 'utf8' });
          const actual = fs.readFileSync('app/build.gradle', 'utf8');
          assert.equal((baseline.match(/versionCode = 195/g) || []).length, 1);
          assert.equal((baseline.match(/versionName = "0.5.22-alpha100-clean"/g) || []).length, 1);
          const expected = baseline
            .replace('versionCode = 195', 'versionCode = 196')
            .replace('versionName = "0.5.22-alpha100-clean"', 'versionName = "0.5.22-alpha101-clean"');
          assert.equal(actual, expected, 'G4C may change ONLY two version fields');
          const p = JSON.parse(fs.readFileSync('tools/gecko-fixture-g4a/BUILD_CONTRACT.json', 'utf8'));
          assert.equal(p.packageId, 'com.prirai.android.nira.debug');
          assert.equal(p.versionCode, 1195, 'Frozen G4A historic evidence must stay unchanged');
          assert.equal(p.signerSha256, 'df90b01217fbbf973b65865be64bfede267e17fec611c355b814585dfba83f00');
          assert.match(actual, /applicationIdSuffix = '.debug'/);
          assert.match(actual, /"arm64-v8a": 1/);
          assert.match(actual, /output.versionCode.set\(base \* 1000 \+ orig\)/);
          const oldRelease = cp.execFileSync('git', ['show', '709f80e8d0ef24be5f14352e0fd1f99ddc301aa7:.github/workflows/apk-release.yml'], { encoding: 'utf8' });
          const released = oldRelease
            .replace('EXPECTED_VERSION_CODE: "1195"', 'EXPECTED_VERSION_CODE: "1196"')
            .replace('EXPECTED_VERSION_NAME: 0.5.22-alpha100-clean', 'EXPECTED_VERSION_NAME: 0.5.22-alpha101-clean')
            .replace('name: zavro-arm64-update-apk-v1195', 'name: zavro-arm64-update-apk-v1196');
          assert.notEqual(oldRelease, released);
          assert.equal(fs.readFileSync('.github/workflows/apk-release.yml', 'utf8'), released,
            'Existing update CI contract must match version 1196 exactly');
          const oldTests = cp.execFileSync('git', ['show', '709f80e8d0ef24be5f14352e0fd1f99ddc301aa7:app/src/test/js/release-contract-stage19a.test.cjs'], { encoding: 'utf8' });
          const expectedTests = oldTests.replaceAll('1195', '1196')
            .replaceAll('0.5.22-alpha100-clean', '0.5.22-alpha101-clean')
            .replaceAll('versionCode = 195', 'versionCode = 196')
            .replace('versionCode = 196\\n        versionCode = 196', 'versionCode = 196\\n        versionCode = 197');
          assert.equal(fs.readFileSync('app/src/test/js/release-contract-stage19a.test.cjs', 'utf8'), expectedTests,
            '19A regression tests may update only version-specific expectations');
          console.log('G4C version 1196, release workflow and regression expectations match; same signature contract; no install.');
          NODE
          node --test tools/gecko-fixture-g3c/tests/*.test.cjs
          if node tools/gecko-fixture-g3c/check-evidence.cjs tools/gecko-fixture-g3c/NOT_TESTED_TEMPLATE.json > "$RUNNER_TEMP/g3c-unobserved"; then
            echo "::error::Unobserved G3C packet incorrectly accepted"; exit 1
          fi
          grep -Fq '"status": "INCOMPLETE"' "$RUNNER_TEMP/g3c-unobserved"

      - name: Full WebExtension JavaScript tests
        run: node --test app/src/test/js/*.test.cjs

      - name: Full Kotlin and Robolectric unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Compile G3 and G3B Android instrumentation (NO device run)
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble stable-signed arm64 debug APK and verify real binary
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for k in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!k:-}" ]]; then
              echo "::error::Missing signing secret $k; unsigned or incompatible APK prohibited."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/g4c-signing.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          export NIRA_SIGNING_STORE_FILE="$keystore"
          export NIRA_SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          export NIRA_SIGNING_KEY_ALIAS="$KEY_ALIAS"
          export NIRA_SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
          ./gradlew :app:assembleDebug --console=plain
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [[ "${#apks[@]}" -ne 1 || "${apks[0]}" != *arm64-v8a* ]]; then
            echo "::error::Expected precisely one arm64-v8a APK, found ${#apks[@]}."
            exit 1
          fi
          bash scripts/verify-update-apk.sh "${apks[0]}" \
            "$EXPECTED_PACKAGE" "$EXPECTED_VERSION_CODE" \
            "$EXPECTED_VERSION_NAME" "$EXPECTED_CERT_SHA256"
          sha256sum "${apks[0]}" > "${apks[0]}.sha256"
          {
            echo "source_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "package=$EXPECTED_PACKAGE"
            echo "version_code=$EXPECTED_VERSION_CODE"
            echo "version_name=$EXPECTED_VERSION_NAME"
            echo "abi=arm64-v8a"
            echo "signer_sha256=$EXPECTED_CERT_SHA256"
            echo "artifact_sha256=$(cut -d' ' -f1 "${apks[0]}.sha256")"
            echo "device_test=NOT_EXECUTED"
            echo "installation=NOT_AUTHORIZED"
          } > app/build/outputs/apk/debug/G4C_PROVENANCE.txt
          echo 'G4C v1196 verified signed update prepared. DO NOT INSTALL without separate approval.'

      - name: Upload signed APK, checksum and provenance (NOT installed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zavro-gecko-g4c-v1196-update-not-installed
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/debug/*arm64-v8a*.apk.sha256
            app/build/outputs/apk/debug/G4C_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Failure-only unit and lint logs (no user data)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zavro-gecko-g4c-failure-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 7
