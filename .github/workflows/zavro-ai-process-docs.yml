name: Zavro AI process - documentation gate (NO APK)

on:
  push:
    branches:
      - "feat/zavro-clean-**"
      - "fix/zavro-clean-**"
      - "chore/zavro-clean-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zavro-ai-process-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prove checkout equals source event SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify V3.2 checkout, branch and scoped sources (NO APK)
        run: node scripts/ai-preflight.cjs --ci "$GITHUB_REF_NAME" "$GITHUB_SHA" CI_TOOLING
      - name: Validate byte-perfect archive and restartable checkpoint (no app build)
        run: node --test scripts/check-ai-handoff.test.cjs
      - name: Verify workflow safety and trigger contract
        run: node --test scripts/check-ci-workflows.test.cjs
      - name: Test lint baseline and evidence gate, including negative cases
        run: node --test scripts/lint-regression.test.cjs scripts/ci-evidence.test.cjs
      - name: Validate stage 7 Gecko device plan (offline structural safety checks)
        run: node --test scripts/check-gecko-device-plan.test.cjs
      - name: Validate one-shot CI event receipt and failure contracts (offline)
        run: node --test scripts/ci-run-receipt.test.cjs
      - name: Validate stage 9 pilot baseline and non-fabricating metrics (offline)
        run: node --test scripts/ai-pilot-metrics.test.cjs
      - name: Validate V3.2 preflight and project source integrity (negative tests)
        run: node --test scripts/ai-preflight.test.cjs scripts/project-sources.test.cjs
      - name: Validate V3.2 persistent error learning and negative tests
        run: |
          node --test scripts/error-learning.test.cjs
          node scripts/error-learning.cjs validate
      - name: Audit all workflow triggers and scopes
        run: node scripts/ci-workflow-inventory.cjs
      - name: Check changes for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
      - name: Check process entrypoints and safety rules (structural checks, not behavior tests)
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const policy = fs.readFileSync('AGENTS.md', 'utf8');
          const entry = fs.readFileSync('docs/ai/CHATGPT_PROJECT_INSTRUCTIONS.md', 'utf8');
          const redirect = fs.readFileSync('.github/agents.md', 'utf8');
          assert.doesNotMatch(policy, /workflow_mode=staged/);
          assert.match(policy, /workflow_mode=autonomous_task/);
          assert.match(policy, /CI_PENDING/);
          assert.match(policy, /CODE_VERIFIED/);
          assert.match(policy, /DEVICE_VERIFIED/);
          assert.match(policy, /APK_VERIFIED/);
          assert.match(policy, /prywatne APK|prywatnego APK|prywatne.*APK/i);
          assert.match(policy, /MIGRATION_V2_CI\.md/);
          assert.match(entry, /AGENTS\.md/);
          assert.match(entry, /AI_HANDOFF\.md/);
          assert.match(entry, /APK_CHAT_GITHUB_REVIEW_TRIGGER\.md/);
          assert.match(redirect, /\.\.\/AGENTS\.md/);
          console.log('Instruction structure: PASS (no APK, signing, release or Gradle performed)');
          NODE
  shared-tests:
    name: Shared regressions (JS, JVM, AndroidTest compile, lint)
    uses: ./.github/workflows/zavro-tests-reusable.yml
    permissions:
      contents: read
  quality-evidence:
    name: Verify required jobs and summarize evidence (NO APK)
    needs: [process-docs, shared-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Capture completed SOURCE CI job errors without write access
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/capture-ci-errors.cjs "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_TEMP/v31-ci-errors.json"
      - name: Upload V3.1 CI evidence (NO APK, no repository mutation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-ci-errors-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v31-ci-errors.json
          retention-days: 30
          if-no-files-found: error
      - name: Check required results and publish run SHA / attempt summary
        env:
          DOCS_RESULT: ${{ needs.process-docs.result }}
          SHARED_RESULT: ${{ needs.shared-tests.result }}
        run: node scripts/ci-evidence.cjs
