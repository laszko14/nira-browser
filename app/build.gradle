android {
    // AC 156 requires compileSdk 37 with minor API level 1 (Android 15.1).
    // AGP 9 exposes the minor level via this DSL block; the old scalar
    // `compileSdkVersion = 37` is equivalent to major-only.
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }

    namespace = 'com.prirai.android.nira'

    defaultConfig {
        applicationId = "com.prirai.android.nira.mpv"
        minSdkVersion 27
        targetSdkVersion 37
        // Increment by 4 with each update, by 1 with each fix
        versionCode = 155
        versionName = "0.5.22-alpha61-mpv29"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    // Only CI's stable, secret-backed signing key can produce update-safe APKs.
    // Without these variables, local test/lint builds keep standard Android debug signing.
    signingConfigs {
        if (System.getenv("NIRA_SIGNING_STORE_FILE") &&
                System.getenv("NIRA_SIGNING_STORE_PASSWORD") &&
                System.getenv("NIRA_SIGNING_KEY_ALIAS") &&
                System.getenv("NIRA_SIGNING_KEY_PASSWORD")) {
            updateDebug {
                storeFile file(System.getenv("NIRA_SIGNING_STORE_FILE"))
                storePassword System.getenv("NIRA_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("NIRA_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("NIRA_SIGNING_KEY_PASSWORD")
            }
        }
    }

    // Keep the release applicationId and the stable .debug testing update track.
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Deliberately NO .debug suffix: separate experimental APK is
            // independently installable from normal Zavro and stable across builds.
            if (signingConfigs.findByName("updateDebug") != null) {
                signingConfig = signingConfigs.getByName("updateDebug")
            }
        }
    }

    flavorDimensions = ["abi"]

    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a'
            universalApk = false
        }
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.15'
    }

    androidResources {
        noCompress += 'ja'
    }

    lint {
        abortOnError = false
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def abiBaseMap = ["arm64-v8a": 1]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.toString() == 'ABI' }?.identifier

            if (abi != null) {
                def base = abiBaseMap[abi] ?: 0
                def orig = output.versionCode.get()
                output.versionCode.set(base * 1000 + orig)
            }
        }
    }
}


